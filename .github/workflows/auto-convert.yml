name: Auto Convert Reusable Rules

on:
  push:
    branches:
      - main
    paths:
      - 'sources.txt'
      - 'convert.py'
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

# 👇【关键修改：加上这几行权限声明，允许 Actions 往仓库里写文件并推送】
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: 运行批量转换脚本
        run: python convert.py

      - name: 自动提交生成的规则文件
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.list
          git commit -m "chore: auto update reusable rule-sets" || exit 0
          git push
